<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرف دل ناشناس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      padding: 30px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      text-align: center;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ef4444, #f59e0b, #10b981, #38bdf8, #6366f1, #ec4899, #ef4444);
      background-size: 400%;
      z-index: -1;
      border-radius: 22px;
      animation: neonBorder 4s linear infinite;
      filter: blur(4px);
    }

    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 20px;
    }

    p.subtitle {
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.5;
      font-weight: 500;
    }

    .input-box, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      display: block;
    }

    .input-box:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    textarea {
      height: 110px;
      resize: none;
    }

    .next-btn {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: block;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .bear-submit-btn {
      background: none;
      border: none;
      width: 100%;
      cursor: pointer;
      padding: 0;
    }

    .bear-container {
      padding: 15px 0;
      animation: bounce 1.5s infinite;
    }

    .bear-emoji {
      font-size: 70px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<!-- آی‌فریم مخفی برای ارسال بدون خطای گوگل‌فرم -->
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(isSubmitted) { showSuccess(); }"></iframe>

<div class="card">
  <form action="https://docs.google.com/forms/d/e/1FAIpQLSft6KHC4vrNUIh_FjDJXhHTMwAJnLZ4pRSNvKHtLjXEagrq3A/formResponse" method="POST" target="hidden_iframe" onsubmit="isSubmitted=true;">
    
    <!-- صفحه اول: نام و پیام -->
    <div id="formScreen" class="screen active">
      <h2>✨ حرف دلتو بگو ✨</h2>
      <p class="subtitle">اول نام یا آیدی روبیکا رو بنویس و بعد حرف دلت رو بفرست</p>
      
      <input type="text" name="entry.1046651828" id="senderName" class="input-box" placeholder="نام یا آیدی روبیکا..." required>
      <textarea name="entry.2096739665" id="messageText" class="input-box" placeholder="اینجا حرف دلتو بنویس..." required></textarea>
      
      <button type="button" class="next-btn" onclick="goToBearScreen()">مرحله بعد</button>
    </div>

    <!-- صفحه دوم: خرس متحرک و ارسال نهایی -->
    <div id="bearScreen" class="screen">
      <h2>یک قدم تا ارسال پیام...</h2>
      <p class="subtitle">روی خرس زیر بزن تا پیامت ارسال بشه 👇</p>

      <button type="submit" class="bear-submit-btn" onclick="spinBear()">
        <div class="bear-container">
          <div class="bear-emoji" id="bearEmoji">🧸</div>
          <p style="color: #38bdf8; font-weight: bold; font-size: 14px;" id="bearText">ارسال نهایی پیام 🚀</p>
        </div>
      </button>
    </div>

    <!-- صفحه موفقیت نهایی -->
    <div id="successScreen" class="screen">
      <div style="font-size: 60px; margin-bottom: 15px;">✅</div>
      <h2 style="color: #10b981;">پیامت با موفقیت ارسال شد!</h2>
      <p class="subtitle">ممنون که حرف دلتو فرستادی 💙</p>
    </div>

  </form>
</div>

<script>
  let isSubmitted = false;

  function goToBearScreen() {
    const name = document.getElementById('senderName').value.trim();
    const message = document.getElementById('messageText').value.trim();

    if (!name || !message) {
      alert('لطفاً هم نام و هم متن پیام رو پر کن!');
      return;
    }

    document.getElementById('formScreen').classList.remove('active');
    document.getElementById('bearScreen').classList.add('active');
  }

  function spinBear() {
    document.getElementById('bearEmoji').style.animation = 'spin 0.6s linear infinite';
    document.getElementById('bearText').innerText = 'در حال ارسال... ⏳';
  }

  function showSuccess() {
    document.getElementById('bearScreen').classList.remove('active');
    document.getElementById('successScreen').classList.add('active');
  }
</script>

</body>
</html>
