<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرف دل ناشناس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-y: auto;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      text-align: center;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ef4444, #f59e0b, #10b981, #38bdf8, #6366f1, #ec4899, #ef4444);
      background-size: 400%;
      z-index: -1;
      border-radius: 22px;
      animation: neonBorder 4s linear infinite;
      filter: blur(4px);
    }

    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 20px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .input-box, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      display: block;
      transition: 0.3s;
    }

    .input-box:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    textarea {
      height: 110px;
      resize: none;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: block;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .bear-container {
      padding: 15px 0;
      cursor: pointer;
      animation: bounce 1.5s infinite;
      user-select: none;
    }

    .bear-emoji {
      font-size: 70px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
      transition: 0.3s;
    }

    .bear-container:hover .bear-emoji {
      transform: scale(1.15);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .success-box {
      animation: zoomIn 0.5s ease-out forwards;
      padding: 10px 0;
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="card">
  <div id="messageForm">
    
    <!-- صفحه اول: نام و پیام -->
    <div id="formScreen" class="screen active">
      <h2>✨ حرف دلتو بگو ✨</h2>
      <p class="subtitle">اول نام یا آیدی روبیکا رو بنویس و بعد حرف دلت رو بفرست</p>
      
      <input type="text" id="senderName" class="input-box" placeholder="نام یا آیدی روبیکا..." required>
      <textarea id="messageText" placeholder="اینجا حرف دلتو بنویس..." required></textarea>
      <button type="button" onclick="goToBearScreen()">ارسال پیام 🚀</button>
    </div>

    <!-- صفحه دوم: خرس تایید نهایی -->
    <div id="bearScreen" class="screen">
      <h2>یک قدم تا ارسال...</h2>
      <p class="subtitle" id="bearSub">لطفاً برای تایید نهایی روی خرس زیر کلیک کن 👇</p>
      
      <div class="bear-container" id="bearBtn" onclick="submitFinalForm()">
        <div class="bear-emoji" id="bearEmoji">🧸</div>
        <p style="color: #38bdf8; font-weight: bold; font-size: 14px;" id="bearText">روی این خرس کلیک کن!</p>
      </div>
    </div>

  </div>

  <!-- صفحه سوم: موفقیت -->
  <div id="successScreen" class="screen">
    <div class="success-box">
      <div class="success-icon">💌</div>
      <h2 style="color: #34d399; margin-bottom: 12px;">پیام شما ارسال شد!</h2>
      <p style="font-size: 14px; line-height: 1.8; color: #f8fafc;">
        ممنونم افتخار دادی پیامی فرستادی 🙏🤍
      </p>
    </div>
  </div>
</div>

<script>
  let audioCtx = null;
  let ambientInterval = null;

  function startSoothingAmbient() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const chords = [
        [261.63, 329.63, 392.00, 493.88],
        [220.00, 261.63, 329.63, 392.00],
        [174.61, 220.00, 261.63, 329.63],
        [196.00, 246.94, 293.66, 349.23]
      ];
      let chordIndex = 0;

      function playChord() {
        if (!audioCtx) return;
        const notes = chords[chordIndex];
        chordIndex = (chordIndex + 1) % chords.length;

        notes.forEach(f => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, audioCtx.currentTime);

          // ولوم کاملاً واضح و شنیدنی
          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 1.0);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.8);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 3.8);
        });
      }

      playChord();
      if (!ambientInterval) {
        ambientInterval = setInterval(playChord, 3200);
      }
    } catch(e) {}
  }

  function stopAmbient() {
    if (ambientInterval) {
      clearInterval(ambientInterval);
      ambientInterval = null;
    }
    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
    }
  }

  function goToBearScreen() {
    const name = document.getElementById('senderName').value.trim();
    const message = document.getElementById('messageText').value.trim();

    if (!name || !message) {
      alert('لطفاً هم نام و هم متن پیام رو پر کن!');
      return;
    }

    document.getElementById('formScreen').classList.remove('active');
    document.getElementById('bearScreen').classList.add('active');
    startSoothingAmbient(); // پخش آهنگ با ولوم بالا
  }

  function submitFinalForm() {
    const name = document.getElementById('senderName').value;
    const message = document.getElementById('messageText').value;

    stopAmbient(); // قطع آهنگ به محض کلیک روی خرس

    document.getElementById('bearEmoji').style.animation = 'spin 1s linear infinite';
    document.getElementById('bearText').innerText = 'در حال ارسال... ⏳';
    document.getElementById('bearBtn').style.pointerEvents = 'none';

    // ارسال آنی پیام
    fetch('https://formsubmit.co/ajax/andjfusw@gmail.com', {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        sender_name: name,
        message: message,
        _captcha: "false"
      })
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById('bearScreen').classList.remove('active');
      document.getElementById('successScreen').classList.add('active');
    })
    .catch(error => {
      document.getElementById('bearScreen').classList.remove('active');
      document.getElementById('successScreen').classList.add('active');
    });
  }
</script>

<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

</body>
</html>
