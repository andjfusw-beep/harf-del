<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرف دل ناشناس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* کادر با رقص نور و حاشیه نئونی متحرک */
    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 28px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      text-align: center;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ef4444, #f59e0b, #10b981, #38bdf8, #6366f1, #ec4899, #ef4444);
      background-size: 400%;
      z-index: -1;
      border-radius: 22px;
      animation: neonBorder 4s linear infinite;
      filter: blur(4px);
    }

    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 8px;
      font-size: 22px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .input-box, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .input-box:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    textarea {
      height: 120px;
      resize: none;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .bear-container {
      padding: 20px 0;
      cursor: pointer;
      animation: bounce 1.5s infinite;
      user-select: none;
    }

    .bear-emoji {
      font-size: 75px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
      transition: 0.3s;
    }

    .bear-container:hover .bear-emoji {
      transform: scale(1.15);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .success-box {
      animation: zoomIn 0.5s ease-out forwards;
      padding: 10px 0;
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="card">

  <!-- فرم اصلی -->
  <div id="formScreen" class="screen active">
    <h2>✨ حرف دلتو بگو ✨</h2>
    <p class="subtitle">اول نام یا آیدی‌ات رو بنویس و بعد حرف دلت رو بفرست</p>
    
    <form id="messageForm" onsubmit="showBear(event)">
      <input type="text" id="senderName" name="sender_name" class="input-box" placeholder="نام یا آیدی شما (مثلاً آیدی روبیکا)..." required>
      <textarea id="messageText" name="message" placeholder="اینجا حرف دلتو بنویس..." required></textarea>
      <button type="submit">ارسال پیام 🚀</button>
    </form>
  </div>

  <!-- صفحه خرس هدایت‌کننده -->
  <div id="bearScreen" class="screen">
    <h2>یک قدم تا ارسال...</h2>
    <p class="subtitle">لطفاً برای تایید نهایی روی خرس زیر کلیک کن 👇</p>
    
    <div class="bear-container" onclick="sendDataAndShowSuccess()">
      <div class="bear-emoji">🧸</div>
      <p style="color: #38bdf8; font-weight: bold; font-size: 14px;">روی این خرس کلیک کن!</p>
    </div>
  </div>

  <!-- صفحه موفقیت هیجان‌انگیز نهایی -->
  <div id="successScreen" class="screen">
    <div class="success-box">
      <div class="success-icon">💌</div>
      <h2 style="color: #34d399; margin-bottom: 12px;">پیام شما ارسال شد!</h2>
      <p style="font-size: 15px; line-height: 1.8; color: #f8fafc;" id="successMsg">
        ممنونم افتخار دادی پیامی فرستادی 🙏🤍
      </p>
    </div>
  </div>

</div>

<script>
  let formDataObj = {};
  let audioCtx = null;
  let ambientInterval = null;

  // پخش موزیک آرامبخش ملایم به صورت ممتد تا زمان ارسال پیام
  function startSoothingAmbient() {
    if (audioCtx) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      // آکوردهای آرامبخش و ملایم پیانو/پد
      const chords = [
        [261.63, 329.63, 392.00, 493.88], // Cmaj7
        [220.00, 261.63, 329.63, 392.00], // Am7
        [174.61, 220.00, 261.63, 329.63], // Fmaj7
        [196.00, 246.94, 293.66, 349.23]  // G7
      ];

      let chordIndex = 0;

      function playChord() {
        if (!audioCtx) return;
        const notes = chords[chordIndex];
        chordIndex = (chordIndex + 1) % chords.length;

        notes.forEach(f => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audioCtx.currentTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(350, audioCtx.currentTime); // صدای بم و نرم

          gain.gain.setValueAtTime(0, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1.2); // محو آرام ورود
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.8); // محو آرام خروج

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 3.8);
        });
      }

      playChord();
      ambientInterval = setInterval(playChord, 3200); // تکرار ملایم آکوردها
    } catch(e) {
      console.log('Audio error:', e);
    }
  }

  // قطع کامل موزیک به محض کلیک روی خرس و ارسال
  function stopAmbient() {
    if (ambientInterval) {
      clearInterval(ambientInterval);
      ambientInterval = null;
    }
    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
    }
  }

  function showBear(event) {
    event.preventDefault();
    
    formDataObj.sender_name = document.getElementById('senderName').value;
    formDataObj.message = document.getElementById('messageText').value;

    document.getElementById('formScreen').classList.remove('active');
    document.getElementById('bearScreen').classList.add('active');
    
    // شروع موزیک ملایم و آرامبخش ممتد
    startSoothingAmbient();
  }

  function sendDataAndShowSuccess() {
    // قطع موزیک هنگام کلیک نهایی روی خرس
    stopAmbient();

    fetch('https://formsubmit.co/ajax/andjfusw@gmail.com', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(formDataObj)
    }).catch(error => console.log('Error:', error));

    document.getElementById('bearScreen').classList.remove('active');
    document.getElementById('successScreen').classList.add('active');
  }
</script>

</body>
</html>
