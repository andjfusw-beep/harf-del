<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرف دل ناشناس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      text-align: center;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ef4444, #f59e0b, #10b981, #38bdf8, #6366f1, #ec4899, #ef4444);
      background-size: 400%;
      z-index: -1;
      border-radius: 22px;
      animation: neonBorder 4s linear infinite;
      filter: blur(4px);
    }

    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 20px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .input-box, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      display: block;
      transition: 0.3s;
    }

    .input-box:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    textarea {
      height: 110px;
      resize: none;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: block;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .success-box {
      animation: zoomIn 0.5s ease-out forwards;
      padding: 10px 0;
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<div class="card">
  <form id="messageForm" action="https://formsubmit.co/andjfusw@gmail.com" method="POST" target="hidden_iframe" onsubmit="handleSubmit(event)">
    
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">

    <div id="formScreen" class="screen active">
      <h2>✨ حرف دلتو بگو ✨</h2>
      <p class="subtitle">اول نام یا آیدی‌ات رو بنویس و بعد حرف دلت رو بفرست</p>
      
      <input type="text" name="sender_name" class="input-box" placeholder="نام یا آیدی شما (مثلاً آیدی روبیکا)..." required>
      <textarea name="message" placeholder="اینجا حرف دلتو بنویس..." required></textarea>
      <button type="submit">ارسال پیام 🚀</button>
    </div>

  </form>

  <div id="successScreen" class="screen">
    <div class="success-box">
      <div class="success-icon">💌</div>
      <h2 style="color: #34d399; margin-bottom: 12px;">پیام شما ارسال شد!</h2>
      <p style="font-size: 14px; line-height: 1.8; color: #f8fafc;">
        ممنونم افتخار دادی پیامی فرستادی 🙏🤍
      </p>
    </div>
  </div>
</div>

<script>
  function handleSubmit(event) {
    // نمایش آنی صفحه موفقیت به محض زدن دکمه ارسال
    document.getElementById('formScreen').classList.remove('active');
    document.getElementById('successScreen').classList.add('active');
  }
</script>

</body>
</html>
