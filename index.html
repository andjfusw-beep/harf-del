<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حرف دل ناشناس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tahoma', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-y: auto;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.2);
      text-align: center;
      z-index: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(45deg, #ef4444, #f59e0b, #10b981, #38bdf8, #6366f1, #ec4899, #ef4444);
      background-size: 400%;
      z-index: -1;
      border-radius: 22px;
      animation: neonBorder 4s linear infinite;
      filter: blur(4px);
    }

    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 20px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .input-box, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #475569;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 15px;
      display: block;
      transition: 0.3s;
    }

    .input-box:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    textarea {
      height: 110px;
      resize: none;
    }

    button {
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      display: block;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .bear-emoji {
      font-size: 60px;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

      font-size: 50px;
      color: #38bdf8;
      font-weight: bold;
      margin: 15px 0;
      text-shadow: 0 0 1
